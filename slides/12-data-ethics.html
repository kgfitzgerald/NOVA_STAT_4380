## Warm-up

We've encountered several data ethics issues so far in this class. Which one(s) are you most concerned about? Why?

+ Bias &amp; Representation
  + Gender data gap
  + Algorithmic bias 
  + Missing datasets (some groups/issues never measured)
+ Data privacy
+ (mis)use of hacked data
+ (mis)use of data by corporations, surveillance
+ (mis)use of data by government, surveillance
+ Visual misrepresentation of data
+ Weakening federal data infrastructure

## Our identities shape our perspectives, experiences, worldviews

+ It's important to work on diverse teams! 
+ Data is collected, analyzed, and interpreted by people whose perspectives and identities shape what they notice, measure, and optimize.

---

## How do we talk about ethics? How do we make ethical decisions?

It's helpful to move beyond vague notions of "this seems bad" or "this seems okay" and be able to **articulate why**. This skill will serve you well in your future (data science) careers, especially as you navigate decisions within teams and organizations.

+ Virtue ethics 
+ Deontological ethics 
+ Utilitarian ethics

Sometimes these lead to different decisions! 

---

+ Begin by circling the values in the list that are most important to you.

    + Try to choose 20-25 top values.

## Let's brainstorm with AI

Go to your preferred AI platform, and brainstorm with it using the following prompts:

1. I'm a student in a data science course. I am interested in pursuing a career in ______. How is data typically used in this field? What kinds of decisions do data and data scientists influence in this field?
2. What ethical risks or controversies have arisen in this field related to data, algorithms, or analytics? Give concrete examples.
3. Imagine I am a data scientist working in this field. What kinds of ethical dilemmas might I realistically encounter in my job?
4. If I wanted to practice responsible data science in this field, what safeguards or habits should I adopt?

---

## Small Group discussion

+ Compare AI's ideas with your own - what did it add? What did it miss? 
+ What ethical issue(s) surprised you?
+ What types of decisions do data (scientists) actually influence in your field?
+ What safeguards seemed most important?

---

## Whole class reflection 

This semester we’ve seen that:

+ governments collect and use enormous datasets
+ corporations track huge amounts of behavior
+ algorithms influence decisions about jobs, credit, policing, etc

**The question is not whether data will be used.**
**The question is: what structures make its use responsible?**

*What would need to exist in society for this power to be used responsibly?*

---

## (at least) three layers of responsibility



1. Inside organizations (companies, government agencies)

  + What safeguards should exist before &amp; after data is collected, or data systems are built &amp; deployed?
  
2. Societal infrastructure 

  + What broader systems are needed?
  
3. Individual responsibility

  + What can data scientists and citizens actually do? 

Discuss in groups and add your ideas to this padlet: [padlet.com/kfitzg24/ethical_brainstorm](https://padlet.com/kfitzg24/ethical_brainstorm)

---
